name: web-image

# optional
# from our proposal GitHub Actions copies the image to Docker Hub
# after a merge to main that touches the web service
# the web image goes to Docker Hub
# never touches AWS and is not a required check
# needs the two Docker Hub secrets for the user name and the token
# and the Docker Hub enabled repo variable set to true
on:
  push:
    branches: [main]
    paths:
      - 'services/web/**'
      - '.github/workflows/web-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/web
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gatekeeper-web:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gatekeeper-web:latest
          # labels say where the image came from
          # same idea as my lab T5E3
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.run_id=${{ github.run_id }}
